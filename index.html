<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictCount | Pro Workspace</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #4a4a68;
            --bg-page: #f8f6ff;
            --lavender: #ece8ff;
            --mint: #b5ead7;
            --peach: #ffdac1;
            --white: #ffffff;
            --border-radius: 20px;
        }

        body { 
            font-family: 'Nunito', system-ui, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main); 
            max-width: 1400px; /* Widened for the Pro Layout */
            margin: 30px auto; 
            padding: 0 20px; 
        }

        /* Header styling tightened up */
        .header-container { margin-bottom: 30px; }
        h1 { color: #6c5ce7; margin: 0 0 5px 0; font-weight: 800; font-size: 32px; letter-spacing: -0.5px;}
        .subtitle { color: #a29bfe; margin: 0; font-size: 15px; font-weight: 600;}
        
        /* The New Pro Layout Grid */
        .layout-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            align-items: flex-start;
        }

        /* Left Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 30px;
        }

        .bubbly-box {
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.06);
            border: 2px solid var(--lavender);
            padding: 20px;
        }

        .upload-zone { text-align: center; cursor: pointer; transition: all 0.2s ease; border: 3px dashed #c8c2f2; background: transparent; }
        .upload-zone:hover, .upload-zone.dragover { background-color: var(--lavender); transform: translateY(-2px); }
        .upload-label { color: #6c5ce7; text-decoration: none; font-weight: 800; cursor: pointer; background: var(--lavender); padding: 4px 12px; border-radius: 12px; font-size: 14px;}
        .upload-zone p { margin: 10px 0; font-size: 14px; }

        .controls { display: flex; flex-direction: column; gap: 15px; }
        .boundary-control { display: flex; flex-direction: column; gap: 6px; }
        .boundary-control span { font-size: 12px; font-weight: 800; color: #6c5ce7; text-transform: uppercase; letter-spacing: 0.5px;}
        .boundary-input { padding: 10px 12px; border: 2px solid var(--lavender); border-radius: 12px; font-family: 'Nunito'; font-size: 14px; outline: none; transition: border 0.2s;}
        .boundary-input:focus { border-color: #6c5ce7; }
        
        label { cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: #6c5ce7; cursor: pointer; }

        /* Stacked Dashboard for Sidebar */
        .dashboard { background: var(--lavender); padding: 25px 20px; text-align: center; display: flex; flex-direction: column; gap: 15px;}
        .stat-box h3 { margin: 0 0 2px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #6c5ce7; font-weight: 800;}
        .stat-box p { margin: 0; font-size: 32px; font-weight: 800; color: var(--text-main); line-height: 1;}
        .highlight p { color: #6c5ce7; font-size: 42px;}
        
        .btn { 
            background-color: var(--mint); color: #2d3436; border: none; 
            padding: 14px 20px; border-radius: 50px; font-family: 'Nunito'; font-size: 15px; font-weight: 800; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(181, 234, 215, 0.6); transition: all 0.2s;
            width: 100%; margin-top: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(181, 234, 215, 0.8); }
        .btn:active { transform: translateY(1px); }

        /* Right Main Content Area */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            height: calc(100vh - 100px);
            min-height: 600px;
        }
        
        .panel-wrapper { display: flex; flex-direction: column; height: 100%; }
        .panel-header { font-weight: 800; margin-bottom: 12px; color: #6c5ce7; font-size: 16px; padding-left: 5px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        textarea, .visualizer { 
            flex: 1; width: 100%; padding: 25px; border: 2px solid var(--lavender); 
            border-radius: var(--border-radius); font-family: 'Nunito'; font-size: 15px; line-height: 1.8; box-sizing: border-box;
            background: var(--white); outline: none; transition: border 0.2s; resize: none;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.03);
        }
        textarea:focus { border-color: #6c5ce7; }
        .visualizer { overflow-y: auto; white-space: pre-wrap; background-color: #faf9ff; }
        
        .excluded-text { background-color: var(--peach); color: #d63031; text-decoration: line-through; padding: 2px 6px; border-radius: 6px; opacity: 0.8;}

        /* The Polished Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #b5b0e5;
            text-align: center;
        }
        .empty-state svg { margin-bottom: 15px; opacity: 0.7; }
        .empty-state p { margin: 0; font-weight: 600; font-size: 16px; }

        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .layout-wrapper { grid-template-columns: 1fr; }
            .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
            .sidebar > * { flex: 1; min-width: 300px; }
            .main-content { height: 600px; }
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; height: auto; }
            textarea, .visualizer { height: 400px; flex: none; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>StrictCount</h1>
        <div class="subtitle">Accurate academic word filtering.</div>
    </div>

    <div class="layout-wrapper">
        <div class="sidebar">
            <div class="bubbly-box upload-zone" id="dropZone">
                <p>Drop your <strong>.docx or .pdf</strong> here</p>
                <p>or <label for="fileInput" class="upload-label">Browse Files</label></p>
                <input type="file" id="fileInput" accept=".docx,.pdf" style="display: none;">
            </div>

            <div class="bubbly-box controls" id="controlPanel">
                <div class="boundary-control">
                    <span>Start counting at (Ignore Titles):</span>
                    <input type="text" id="startMarker" class="boundary-input" placeholder='e.g., Introduction'>
                </div>
                <div class="boundary-control">
                    <span>Stop counting at (Ignore Bibliography):</span>
                    <input type="text" id="endMarker" class="boundary-input" placeholder='e.g., References'>
                </div>
                <hr style="border: 1px solid var(--lavender); width: 100%; margin: 5px 0;">
                <label><input type="checkbox" id="excludeAPA" checked> Hide APA/Harvard</label>
                <label><input type="checkbox" id="excludeMLA" checked> Hide MLA</label>
                <label><input type="checkbox" id="excludeIEEE" checked> Hide IEEE/Chicago</label>
                <label><input type="checkbox" id="excludeCaptions" checked> Hide Captions & Mentions</label> 
            </div>

            <div class="bubbly-box dashboard">
                <div class="stat-box"><h3>Total Words</h3><p id="originalCount">0</p></div>
                <div class="stat-box"><h3>Filtered Out</h3><p id="excludedCount">0</p></div>
                <div class="stat-box highlight"><h3>True Word Count</h3><p id="finalCount">0</p></div>
                <button class="btn" id="copyBtn">Copy Clean Text</button>
            </div>
        </div>

        <div class="main-content">
            <div class="panel-wrapper">
                <div class="panel-header">Raw Input</div>
                <textarea id="inputText" placeholder="Paste your essay text here, or upload a document using the panel on the left..."></textarea>
            </div>
            
            <div class="panel-wrapper">
                <div class="panel-header">Live Verification</div>
                <div id="visualizer" class="visualizer">
                    <div class="empty-state">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#c8c2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <p>Your verified text will appear here.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const regexAPA = /\([^)]*\b\d{4}\b[^)]*\)/g; 
        const regexMLA = /\([A-Za-z\s\.\-&]+ \d+\)/g;
        const regexIEEE = /(\[\s*\d+(?:\s*[-,]\s*\d+)*\s*\])|(\(\s*\d+(?:\s*[-,]\s*\d+)*\s*\))/g; 
        const regexCaptions = /^\s*(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[.:\-]?\s+[\s\S]*?(?=\n\n|$)/gim;
        const regexInTextFigs = /\([^)]*\b(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[^)]*\)/gi;

        let finalCleanText = "";

        // The SVG to show when the text area is empty
        const emptyStateHTML = `
            <div class="empty-state">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#c8c2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p>Your verified text will appear here.</p>
            </div>
        `;

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function countWords(str) { const words = str.trim().split(/\s+/); return words[0] === '' ? 0 : words.length; }

        function processText() {
            const rawText = document.getElementById('inputText').value;
            
            // If text is empty, show the empty state and reset counters
            if (!rawText.trim()) {
                document.getElementById('visualizer').innerHTML = emptyStateHTML;
                document.getElementById('originalCount').innerText = "0";
                document.getElementById('finalCount').innerText = "0";
                document.getElementById('excludedCount').innerText = "0";
                finalCleanText = "";
                return;
            }

            let filteredText = rawText;
            let visualText = rawText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const activeFilters = [];
            const startStr = document.getElementById('startMarker').value.trim();
            const endStr = document.getElementById('endMarker').value.trim();

            if (startStr !== "") activeFilters.push(new RegExp('^[\\s\\S]*?(?=\\b' + escapeRegExp(startStr) + '\\b)', 'i'));
            if (endStr !== "") activeFilters.push(new RegExp('\\b' + escapeRegExp(endStr) + '\\b[\\s\\S]*', 'i'));
            
            if (document.getElementById('excludeAPA').checked) activeFilters.push(regexAPA);
            if (document.getElementById('excludeMLA').checked) activeFilters.push(regexMLA);
            if (document.getElementById('excludeIEEE').checked) activeFilters.push(regexIEEE);
            if (document.getElementById('excludeCaptions').checked) {
                activeFilters.push(regexCaptions);
                activeFilters.push(regexInTextFigs); 
            }

            activeFilters.forEach(regex => {
                filteredText = filteredText.replace(regex, ' ');
                visualText = visualText.replace(regex, match => `<span class="excluded-text">${match}</span>`);
            });

            finalCleanText = filteredText.replace(/\s+/g, ' ').trim();

            const ogCount = countWords(rawText);
            const finCount = countWords(filteredText);
            
            document.getElementById('originalCount').innerText = ogCount;
            document.getElementById('finalCount').innerText = finCount;
            document.getElementById('excludedCount').innerText = ogCount - finCount;
            document.getElementById('visualizer').innerHTML = visualText;
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const textArea = document.getElementById('inputText');

        async function extractTextFromPDF(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let extractedText = [];
            
            for (let j = 1; j <= pdf.numPages; j++) {
                let page = await pdf.getPage(j);
                let textContent = await page.getTextContent();
                let pageText = "";
                let lastY = -1;

                for (let item of textContent.items) {
                    let str = item.str.trim();
                    if (!str) continue; 
                    
                    if (lastY !== -1) {
                        let deltaY = Math.abs(lastY - item.transform[5]);
                        if (deltaY > 22) { pageText += '\n\n'; } 
                        else if (deltaY > 4) { pageText += ' '; }
                        else { pageText += ' '; }
                    }
                    pageText += str;
                    lastY = item.transform[5];
                }
                extractedText.push(pageText);
            }
            return extractedText.join('\n\n');
        }

        function handleFile(file) {
            const extension = file.name.split('.').pop().toLowerCase();
            if (extension !== 'docx' && extension !== 'pdf') { alert("Unsupported file format. Please use .docx or .pdf."); return; }

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    let extractedString = "";
                    if (extension === 'docx') {
                        const result = await mammoth.extractRawText({arrayBuffer: event.target.result});
                        extractedString = result.value;
                    } 
                    else if (extension === 'pdf') {
                        extractedString = await extractTextFromPDF(event.target.result);
                    }
                    textArea.value = extractedString;
                    processText(); 
                } catch (err) { alert(`Error reading your ${extension.toUpperCase()} file.`); }
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', e => { if(e.target.files.length > 0) handleFile(e.target.files[0]); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        textArea.addEventListener('input', processText);
        document.querySelectorAll('#controlPanel input[type="checkbox"]').forEach(box => box.addEventListener('change', processText));
        document.querySelectorAll('.boundary-input').forEach(input => input.addEventListener('input', processText));

        document.getElementById('copyBtn').addEventListener('click', function(e) {
            if (!finalCleanText) return;
            navigator.clipboard.writeText(finalCleanText).then(() => {
                
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#b5ead7', '#ffdac1', '#6c5ce7', '#ece8ff']
                });

                const btn = document.getElementById('copyBtn');
                btn.innerText = "Copied to Clipboard!";
                btn.style.backgroundColor = "#fff";
                btn.style.color = "#6c5ce7";
                
                setTimeout(() => {
                    btn.innerText = "Copy Clean Text";
                    btn.style.backgroundColor = "var(--mint)";
                    btn.style.color = "#2d3436";
                }, 2000);
            });
        });
    </script>
</body>
</html>
