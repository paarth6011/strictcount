<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictCount | Professional</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent-green: #15803d; 
            --border-light: #e5e7eb;
            --btn-dark: #111827;
            --border-radius: 12px;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main); 
            max-width: 1400px; 
            margin: 30px auto; 
            padding: 0 20px; 
            line-height: 1.6;
        }

        /* Header */
        .header-container { margin-bottom: 30px; }
        h1 { margin: 0; font-weight: 700; font-size: 28px; letter-spacing: -1px; color: var(--text-main);}
        .subtitle { color: var(--text-muted); margin-top: 4px; font-size: 14px; font-weight: 500;}
        
        /* Layout Grid */
        .layout-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            align-items: flex-start;
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 30px;
        }

        .panel-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 20px;
        }

        /* Upload Zone */
        .upload-zone { text-align: center; cursor: pointer; transition: all 0.2s; border: 2px dashed var(--border-light); box-shadow: none;}
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--text-main); background: #f9fafb;}
        .upload-label { font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; color: var(--text-main);}
        .upload-zone p { margin: 5px 0; font-size: 14px; color: var(--text-muted); }

        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 20px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        
        .boundary-input { 
            padding: 10px 12px; border: 1px solid var(--border-light); border-radius: 8px; 
            font-family: inherit; font-size: 13px; outline: none; transition: border 0.2s;
        }
        .boundary-input:focus { border-color: var(--text-main); }
        
        label { cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: var(--text-main);}
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text-main); cursor: pointer; }

        /* Dashboard */
        .dashboard { padding: 25px 20px; text-align: center; display: flex; flex-direction: column; gap: 15px;}
        .stat-box h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600;}
        .stat-box p { margin: 2px 0 0 0; font-size: 28px; font-weight: 700; color: var(--text-main); line-height: 1; letter-spacing: -0.5px;}
        .highlight p { color: var(--accent-green); font-size: 36px;}
        
        .btn { 
            background-color: var(--btn-dark); color: #ffffff; border: none; 
            padding: 14px 20px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; 
            cursor: pointer; transition: background-color 0.2s; width: 100%; margin-top: 10px;
        }
        .btn:hover { background-color: #000000; }

        /* Right Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            height: calc(100vh - 100px);
            min-height: 600px;
        }
        
        .panel-wrapper { display: flex; flex-direction: column; height: 100%; }
        .panel-header { font-weight: 600; margin-bottom: 12px; color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        textarea, .visualizer { 
            flex: 1; width: 100%; padding: 25px; border: 1px solid var(--border-light); 
            border-radius: var(--border-radius); font-family: inherit; font-size: 15px; line-height: 1.7; box-sizing: border-box;
            background: var(--card-bg); outline: none; transition: border 0.2s; resize: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        textarea:focus { border-color: var(--text-main); }
        .visualizer { overflow-y: auto; white-space: pre-wrap; background-color: #ffffff; }
        
        .excluded-text { color: #a1a1aa; text-decoration: line-through; background: #f4f4f5; border-radius: 4px; padding: 0 4px;}

        /* Responsive */
        @media (max-width: 1024px) {
            .layout-wrapper { grid-template-columns: 1fr; }
            .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
            .sidebar > * { flex: 1; min-width: 300px; }
            .main-content { height: 600px; }
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; height: auto; }
            textarea, .visualizer { height: 400px; flex: none; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>StrictCount</h1>
        <div class="subtitle">Accurate academic word filtering.</div>
    </div>

    <div class="layout-wrapper">
        <div class="sidebar">
            <div class="panel-card upload-zone" id="dropZone">
                <p style="color: var(--text-main); font-weight: 500;">Drop your <strong>.docx</strong> or <strong>.pdf</strong> here</p>
                <p>or <label for="fileInput" class="upload-label">browse files</label></p>
                <input type="file" id="fileInput" accept=".docx,.pdf" style="display: none;">
            </div>

            <div class="panel-card controls" id="controlPanel">
                <div class="control-group">
                    <span class="control-label">Boundaries</span>
                    <input type="text" id="startMarker" class="boundary-input" placeholder='Start count at (e.g., Introduction)'>
                    <input type="text" id="endMarker" class="boundary-input" placeholder='Stop count at (e.g., References)'>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border-light); width: 100%; margin: 5px 0;">
                <div class="control-group">
                    <span class="control-label">Filters</span>
                    <label><input type="checkbox" id="excludeAPA" checked> Hide APA/Harvard</label>
                    <label><input type="checkbox" id="excludeMLA" checked> Hide MLA</label>
                    <label><input type="checkbox" id="excludeIEEE" checked> Hide IEEE/Chicago</label>
                    <label><input type="checkbox" id="excludeCaptions" checked> Hide Captions & Mentions</label> 
                </div>
            </div>

            <div class="panel-card dashboard">
                <div class="stat-box"><h3>Gross Words</h3><p id="originalCount">0</p></div>
                <div class="stat-box"><h3>Filtered Out</h3><p id="excludedCount">0</p></div>
                <div class="stat-box highlight"><h3>Strict Count</h3><p id="finalCount">0</p></div>
                <button class="btn" id="copyBtn">Copy Clean Text</button>
            </div>
        </div>

        <div class="main-content">
            <div class="panel-wrapper">
                <div class="panel-header">Raw Input</div>
                <textarea id="inputText" placeholder="Paste your essay text here, or upload a document using the panel on the left..."></textarea>
            </div>
            
            <div class="panel-wrapper">
                <div class="panel-header">Verified Output</div>
                <div id="visualizer" class="visualizer"></div>
            </div>
        </div>
    </div>

    <script>
        const regexAPA = /\([^)]*\b\d{4}\b[^)]*\)/g; 
        const regexMLA = /\([A-Za-z\s\.\-&]+ \d+\)/g;
        const regexIEEE = /(\[\s*\d+(?:\s*[-,]\s*\d+)*\s*\])|(\(\s*\d+(?:\s*[-,]\s*\d+)*\s*\))/g; 
        const regexCaptions = /^\s*(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[.:\-]?\s+[\s\S]*?(?=\n\n|$)/gim;
        const regexInTextFigs = /\([^)]*\b(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[^)]*\)/gi;

        let finalCleanText = "";

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function countWords(str) { const words = str.trim().split(/\s+/); return words[0] === '' ? 0 : words.length; }

        function processText() {
            const rawText = document.getElementById('inputText').value;
            
            if (!rawText.trim()) {
                document.getElementById('visualizer').innerHTML = "";
                document.getElementById('originalCount').innerText = "0";
                document.getElementById('finalCount').innerText = "0";
                document.getElementById('excludedCount').innerText = "0";
                finalCleanText = "";
                return;
            }

            let filteredText = rawText;
            let visualText = rawText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const activeFilters = [];
            const startStr = document.getElementById('startMarker').value.trim();
            const endStr = document.getElementById('endMarker').value.trim();

            if (startStr !== "") activeFilters.push(new RegExp('^[\\s\\S]*?(?=\\b' + escapeRegExp(startStr) + '\\b)', 'i'));
            if (endStr !== "") activeFilters.push(new RegExp('\\b' + escapeRegExp(endStr) + '\\b[\\s\\S]*', 'i'));
            
            if (document.getElementById('excludeAPA').checked) activeFilters.push(regexAPA);
            if (document.getElementById('excludeMLA').checked) activeFilters.push(regexMLA);
            if (document.getElementById('excludeIEEE').checked) activeFilters.push(regexIEEE);
            if (document.getElementById('excludeCaptions').checked) {
                activeFilters.push(regexCaptions);
                activeFilters.push(regexInTextFigs); 
            }

            activeFilters.forEach(regex => {
                filteredText = filteredText.replace(regex, ' ');
                visualText = visualText.replace(regex, match => `<span class="excluded-text">${match}</span>`);
            });

            finalCleanText = filteredText.replace(/\s+/g, ' ').trim();

            const ogCount = countWords(rawText);
            const finCount = countWords(filteredText);
            
            document.getElementById('originalCount').innerText = ogCount;
            document.getElementById('finalCount').innerText = finCount;
            document.getElementById('excludedCount').innerText = ogCount - finCount;
            document.getElementById('visualizer').innerHTML = visualText;
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const textArea = document.getElementById('inputText');

        async function extractTextFromPDF(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let extractedText = [];
            
            for (let j = 1; j <= pdf.numPages; j++) {
                let page = await pdf.getPage(j);
                let textContent = await page.getTextContent();
                let pageText = "";
                let lastY = -1;

                for (let item of textContent.items) {
                    let str = item.str.trim();
                    if (!str) continue; 
                    
                    if (lastY !== -1) {
                        let deltaY = Math.abs(lastY - item.transform[5]);
                        if (deltaY > 22) { pageText += '\n\n'; } 
                        else if (deltaY > 4) { pageText += ' '; }
                        else { pageText += ' '; }
                    }
                    pageText += str;
                    lastY = item.transform[5];
                }
                extractedText.push(pageText);
            }
            return extractedText.join('\n\n');
        }

        function handleFile(file) {
            const extension = file.name.split('.').pop().toLowerCase();
            if (extension !== 'docx' && extension !== 'pdf') { alert("Unsupported file format. Please use .docx or .pdf."); return; }

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    let extractedString = "";
                    if (extension === 'docx') {
                        const result = await mammoth.extractRawText({arrayBuffer: event.target.result});
                        extractedString = result.value;
                    } 
                    else if (extension === 'pdf') {
                        extractedString = await extractTextFromPDF(event.target.result);
                    }
                    textArea.value = extractedString;
                    processText(); 
                } catch (err) { alert(`Error reading your ${extension.toUpperCase()} file.`); }
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', e => { if(e.target.files.length > 0) handleFile(e.target.files[0]); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        textArea.addEventListener('input', processText);
        document.querySelectorAll('#controlPanel input[type="checkbox"]').forEach(box => box.addEventListener('change', processText));
        document.querySelectorAll('.boundary-input').forEach(input => input.addEventListener('input', processText));

        document.getElementById('copyBtn').addEventListener('click', function(e) {
            if (!finalCleanText) return;
            navigator.clipboard.writeText(finalCleanText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "Copied to Clipboard!";
                btn.style.backgroundColor = "var(--accent-green)"; 
                
                setTimeout(() => {
                    btn.innerText = "Copy Clean Text";
                    btn.style.backgroundColor = "var(--btn-dark)";
                }, 2000);
            });
        });
    </script>
</body>
</html>
