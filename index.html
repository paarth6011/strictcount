<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictCount</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
            --border-focus: #111827;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }

        .header-container { margin-bottom: 0; }
        h1 { margin: 0; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; color: var(--text-main); }
        .subtitle { color: var(--text-muted); margin-top: 6px; font-size: 15px; font-weight: 400; }

        .top-dashboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            padding: 24px 32px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-light);
        }

        .stat-group {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .stat-box {
            padding: 0 40px;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .stat-box:first-child { padding-left: 0; }
        .stat-box:last-child { border-right: none; padding-right: 0; }

        .stat-box h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
        .stat-box p { margin: 6px 0 0 0; font-size: 34px; font-weight: 700; color: var(--text-main); line-height: 1; letter-spacing: -0.5px; }

        .btn {
            background-color: var(--text-main); color: #ffffff; border: none;
            padding: 16px 40px; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background-color 0.2s; white-space: nowrap;
        }
        .btn:hover { background-color: #000000; }
        .btn--success { background-color: #059669; }
        .btn--success:hover { background-color: #047857; }

        .layout-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 50px;
            align-items: flex-start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: sticky;
            top: 50px;
        }

        .panel-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-light);
            padding: 30px;
        }

        .upload-zone { text-align: center; cursor: pointer; transition: all 0.2s; border: 1px dashed #d1d5db; box-shadow: none; }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--text-main); background: #f9fafb; }
        .upload-zone--processing { opacity: 0.6; pointer-events: none; }
        .upload-label { font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; color: var(--text-main); }
        .upload-zone p { margin: 5px 0; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .upload-zone .upload-title { color: var(--text-main); font-weight: 600; margin-bottom: 10px; }

        .error-banner {
            display: none;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 13px;
            color: #dc2626;
            font-weight: 500;
        }
        .error-banner.visible { display: block; }

        .control-section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
        }
        .control-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; display: block; }

        .boundary-input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 6px;
            font-family: inherit; font-size: 13px; outline: none; transition: border 0.2s; box-sizing: border-box;
            margin-bottom: 12px;
        }
        .boundary-input:last-child { margin-bottom: 0; }
        .boundary-input:focus { border-color: var(--text-main); }

        .checkbox-group { display: flex; flex-direction: column; gap: 14px; }
        label { cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text-main); cursor: pointer; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            min-width: 0;
        }

        .panel-wrapper { display: flex; flex-direction: column; }
        .panel-header { font-weight: 600; margin-bottom: 16px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        textarea, .visualizer {
            width: 100%;
            height: 550px;
            padding: 24px;
            border: 1px solid var(--border-light);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.8;
            box-sizing: border-box;
            background: var(--card-bg);
            outline: none;
            transition: border 0.2s;
            resize: none;
            overflow-y: auto;
        }

        textarea:focus { border-color: var(--border-focus); }
        .visualizer { white-space: pre-wrap; }
        .excluded-text { color: #9ca3af; text-decoration: line-through; background: #f3f4f6; border-radius: 4px; padding: 0 4px; }

        @media (max-width: 1150px) {
            .stat-box { padding: 0 20px; }
        }
        @media (max-width: 1024px) {
            .top-row { flex-direction: column; align-items: stretch; }
            .header-container { text-align: center; }
            .top-dashboard { justify-content: center; }
            .layout-wrapper { grid-template-columns: 1fr; }
            .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
            .sidebar > * { flex: 1; min-width: 250px; }
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            textarea, .visualizer { height: 400px; }
            .stat-group { flex-direction: column; width: 100%; }
            .stat-box { border-right: none; border-bottom: 1px solid var(--border-light); padding: 20px 0; width: 100%; }
            .stat-box:first-child { padding-top: 0; }
            .stat-box:last-child { border-bottom: none; padding-bottom: 0; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-row">
        <div class="header-container">
            <h1>StrictCount</h1>
            <div class="subtitle">Accurate academic word filtering.</div>
        </div>

        <div class="top-dashboard">
            <div class="stat-group" role="status" aria-live="polite" aria-label="Word count statistics">
                <div class="stat-box"><h3>Gross Words</h3><p id="originalCount">0</p></div>
                <div class="stat-box"><h3>Filtered Out</h3><p id="excludedCount">0</p></div>
                <div class="stat-box"><h3>Strict Count</h3><p id="finalCount">0</p></div>
            </div>
            <button class="btn" id="copyBtn" aria-label="Copy filtered text to clipboard">Copy Clean Text</button>
        </div>
    </div>

    <div class="layout-wrapper">

        <div class="sidebar">
            <div class="panel-card upload-zone" id="dropZone" role="button" aria-label="Upload a .docx or .pdf file">
                <p class="upload-title">Drop your .docx or .pdf here</p>
                <p>or</p>
                <p style="margin-top: 10px;"><label for="fileInput" class="upload-label">browse files</label></p>
                <p id="uploadStatus"></p>
                <input type="file" id="fileInput" accept=".docx,.pdf" aria-label="Choose a .docx or .pdf file" style="display: none;">
            </div>

            <div id="errorBanner" class="error-banner" role="alert"></div>

            <div class="panel-card">
                <div class="control-section">
                    <span class="section-title">Boundaries</span>
                    <input type="text" id="startMarker" class="boundary-input" placeholder="Start count at (e.g., Introduction)" aria-label="Start counting at this word">
                    <input type="text" id="endMarker" class="boundary-input" placeholder="Stop count at (e.g., References)" aria-label="Stop counting at this word">
                </div>

                <div class="control-section">
                    <span class="section-title">Filters</span>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="excludeAPA" checked> Hide APA/Harvard</label>
                        <label><input type="checkbox" id="excludeMLA" checked> Hide MLA</label>
                        <label><input type="checkbox" id="excludeIEEE" checked> Hide IEEE/Chicago</label>
                        <label><input type="checkbox" id="excludeCaptions" checked> Hide Captions &amp; Mentions</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel-wrapper">
                <div class="panel-header">Raw Input</div>
                <textarea id="inputText" placeholder="Paste your essay text here, or upload a document using the panel on the left..." aria-label="Raw input text"></textarea>
            </div>

            <div class="panel-wrapper">
                <div class="panel-header">Verified Output</div>
                <div id="visualizer" class="visualizer" role="region" aria-label="Filtered output with exclusions highlighted"></div>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        // Constants
        // ================================================================

        const MAX_FILE_SIZE_MB = 20;

        // Token markers for the placeholder approach (non-printable chars
        // that will never appear in academic text).
        const TOKEN_START = '\x00';
        const TOKEN_END   = '\x01';
        const TOKEN_RE    = /\x00(\d+)\x01/g;

        // Strategy pattern: each filter is a self-contained config object.
        // patterns() is a factory that returns fresh regex instances on every
        // call, so lastIndex state can never bleed between processText() runs.
        const FILTER_CONFIG = [
            {
                id: 'excludeAPA',
                patterns: () => [/\([^)]*\b\d{4}\b[^)]*\)/g]
            },
            {
                id: 'excludeMLA',
                patterns: () => [/\([A-Za-z\s.\-&]+ \d+\)/g]
            },
            {
                id: 'excludeIEEE',
                patterns: () => [/(\[\s*\d+(?:\s*[-,]\s*\d+)*\s*\])|(\(\s*\d+(?:\s*[-,]\s*\d+)*\s*\))/g]
            },
            {
                id: 'excludeCaptions',
                patterns: () => [
                    /^\s*(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[.:\-]?\s+[\s\S]*?(?=\n\n|$)/gim,
                    /\([^)]*\b(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[^)]*\)/gi
                ]
            }
        ];

        // ================================================================
        // Utilities
        // ================================================================

        function escapeHTML(str) {
            // Escape & first to avoid double-escaping sequences like &lt;
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function countWords(str) {
            const trimmed = str.trim();
            return trimmed === '' ? 0 : trimmed.split(/\s+/).length;
        }

        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        // ================================================================
        // DOM References (cached once — avoids repeated getElementById calls)
        // ================================================================

        const inputText     = document.getElementById('inputText');
        const visualizerEl  = document.getElementById('visualizer');
        const dropZone      = document.getElementById('dropZone');
        const fileInput     = document.getElementById('fileInput');
        const copyBtn       = document.getElementById('copyBtn');
        const errorBanner   = document.getElementById('errorBanner');
        const uploadStatus  = document.getElementById('uploadStatus');
        const startMarkerEl = document.getElementById('startMarker');
        const endMarkerEl   = document.getElementById('endMarker');
        const originalCount = document.getElementById('originalCount');
        const excludedCount = document.getElementById('excludedCount');
        const finalCount    = document.getElementById('finalCount');

        // ================================================================
        // State
        // ================================================================

        let finalCleanText = '';

        // ================================================================
        // UI Helpers
        // ================================================================

        function resetUI() {
            visualizerEl.innerHTML = '';
            originalCount.textContent = '0';
            excludedCount.textContent = '0';
            finalCount.textContent = '0';
            finalCleanText = '';
        }

        function updateStats(gross, strict) {
            originalCount.textContent = gross;
            finalCount.textContent = strict;
            excludedCount.textContent = gross - strict;
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('visible');
        }

        function clearError() {
            errorBanner.classList.remove('visible');
        }

        function setLoading(loading) {
            dropZone.classList.toggle('upload-zone--processing', loading);
            uploadStatus.textContent = loading ? 'Processing…' : '';
        }

        // ================================================================
        // Filter Logic
        // ================================================================

        function buildActiveFilters(startStr, endStr) {
            const filters = [];

            if (startStr) {
                filters.push(new RegExp('^[\\s\\S]*?(?=\\b' + escapeRegExp(startStr) + '\\b)', 'i'));
            }
            if (endStr) {
                filters.push(new RegExp('\\b' + escapeRegExp(endStr) + '\\b[\\s\\S]*', 'i'));
            }

            FILTER_CONFIG.forEach(({ id, patterns }) => {
                if (document.getElementById(id).checked) {
                    filters.push(...patterns());
                }
            });

            return filters;
        }

        function processText() {
            const rawText = inputText.value;
            if (!rawText.trim()) { resetUI(); return; }

            const startStr = startMarkerEl.value.trim();
            const endStr   = endMarkerEl.value.trim();

            // Pass 1 — build filteredText (plain text, for word counting)
            const countFilters = buildActiveFilters(startStr, endStr);
            let filteredText = rawText;
            countFilters.forEach(rx => { filteredText = filteredText.replace(rx, ' '); });

            // Pass 2 — build visual HTML using a placeholder approach:
            //   a) Apply regexes to raw text, replacing matches with tokens
            //   b) HTML-escape the tokenised string (control chars survive escaping)
            //   c) Swap tokens for styled <span> elements
            //
            // This ensures regexes always run on clean plain text (not HTML-escaped
            // text), fixing a class of mismatches where HTML entities like &amp;
            // would prevent citation patterns from matching in the visual pass.
            const visualFilters = buildActiveFilters(startStr, endStr);
            const excluded = [];
            let marked = rawText;
            visualFilters.forEach(rx => {
                marked = marked.replace(rx, match => {
                    excluded.push(match);
                    return `${TOKEN_START}${excluded.length - 1}${TOKEN_END}`;
                });
            });

            const visualHTML = escapeHTML(marked).replace(TOKEN_RE, (_, i) =>
                `<span class="excluded-text">${escapeHTML(excluded[+i])}</span>`
            );

            finalCleanText = filteredText.replace(/\s+/g, ' ').trim();
            updateStats(countWords(rawText), countWords(filteredText));
            visualizerEl.innerHTML = visualHTML;
        }

        // ================================================================
        // File Handling
        // ================================================================

        async function extractTextFromPDF(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            const pageTexts = [];

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                try {
                    const page = await pdf.getPage(pageNum);
                    const { items } = await page.getTextContent();
                    let pageText = '';
                    let lastY = null;

                    for (const item of items) {
                        const str = item.str.trim();
                        if (!str) continue;
                        if (lastY !== null) {
                            pageText += Math.abs(lastY - item.transform[5]) > 22 ? '\n\n' : ' ';
                        }
                        pageText += str;
                        lastY = item.transform[5];
                    }
                    pageTexts.push(pageText);
                } catch {
                    // Skip pages that fail rather than aborting the whole document
                }
            }

            if (pageTexts.length === 0) throw new Error('No readable text found in PDF.');
            return pageTexts.join('\n\n');
        }

        async function handleFile(file) {
            clearError();

            if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
                showError(`File is too large. Maximum size is ${MAX_FILE_SIZE_MB} MB.`);
                return;
            }

            const extension = file.name.split('.').pop().toLowerCase();
            if (extension !== 'docx' && extension !== 'pdf') {
                showError('Unsupported format. Please upload a .docx or .pdf file.');
                return;
            }

            setLoading(true);
            try {
                const arrayBuffer = await file.arrayBuffer();
                let text = '';

                if (extension === 'docx') {
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    text = result.value;
                } else {
                    text = await extractTextFromPDF(arrayBuffer);
                }

                inputText.value = text;
                processText();
            } catch {
                showError(`Could not read the ${extension.toUpperCase()} file. It may be corrupted or password-protected.`);
            } finally {
                setLoading(false);
                fileInput.value = ''; // Reset so the same file can be re-uploaded
            }
        }

        // ================================================================
        // Clipboard
        // ================================================================

        async function copyToClipboard(text) {
            if (navigator.clipboard) {
                return navigator.clipboard.writeText(text);
            }
            // Fallback for browsers without the Clipboard API
            const ta = document.createElement('textarea');
            Object.assign(ta.style, { position: 'fixed', opacity: '0' });
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        // ================================================================
        // Event Listeners
        // ================================================================

        const debouncedProcess = debounce(processText, 300);

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        // Debounce free-text inputs; respond immediately to checkbox toggles
        inputText.addEventListener('input', debouncedProcess);
        document.querySelectorAll('.boundary-input').forEach(el => el.addEventListener('input', debouncedProcess));
        document.querySelectorAll('input[type="checkbox"]').forEach(el => el.addEventListener('change', processText));

        copyBtn.addEventListener('click', async () => {
            if (!finalCleanText) return;
            try {
                await copyToClipboard(finalCleanText);
                copyBtn.textContent = 'Copied to Clipboard!';
                copyBtn.classList.add('btn--success');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy Clean Text';
                    copyBtn.classList.remove('btn--success');
                }, 2000);
            } catch {
                showError('Could not copy to clipboard. Please select and copy the text manually.');
            }
        });
    </script>
</body>
</html>
