<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictCount</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --border-focus: #000000;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            max-width: 1000px; 
            margin: 60px auto; 
            padding: 0 20px; 
            line-height: 1.6;
        }

        /* Minimal Header */
        header { border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 40px; }
        h1 { margin: 0; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); margin-top: 4px; font-size: 15px; }

        /* Clean Upload Zone */
        .upload-zone { 
            border: 1px dashed var(--border-color); 
            padding: 40px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: border-color 0.2s;
            margin-bottom: 40px;
            border-radius: 8px;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--border-focus); }
        .upload-label { font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; color: var(--text-main); }
        .upload-zone p { margin: 5px 0; font-size: 14px; color: var(--text-muted); }

        /* Stark Controls Grid */
        .controls-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .control-group { display: flex; flex-direction: column; gap: 12px; }
        .control-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        
        .boundary-input { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px;
            font-family: inherit; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .boundary-input:focus { border-color: var(--border-focus); }

        /* Scoped Checkbox Rules to fix previous bug */
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
        .checkbox-group label { cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; color: var(--text-main);}
        input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text-main); cursor: pointer; }

        /* Stark Stats Dashboard */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 30px 0;
            margin-bottom: 40px;
        }
        .stat-box { display: flex; flex-direction: column; gap: 4px; }
        .stat-box h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600;}
        .stat-box p { margin: 0; font-size: 42px; font-weight: 400; letter-spacing: -1px; line-height: 1;}
        .highlight p { font-weight: 700; }

        /* The Main Action Button */
        .btn { 
            background-color: var(--text-main); color: var(--bg-color); border: none; 
            padding: 16px 24px; border-radius: 6px; font-family: inherit; font-size: 15px; font-weight: 600; 
            cursor: pointer; transition: background-color 0.2s;
            width: 100%; margin-bottom: 40px;
        }
        .btn:hover { background-color: #333333; }
        
        /* Fixed Text Areas with Inner Scrolling */
        .text-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .panel-wrapper { display: flex; flex-direction: column; }
        .panel-header { font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.5px;}
        
        textarea, .visualizer { 
            width: 100%; 
            height: 500px; /* Firmly locked height */
            padding: 20px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px;
            font-family: inherit; 
            font-size: 14px; 
            line-height: 1.8; 
            box-sizing: border-box;
            background: var(--bg-color); 
            outline: none; 
            transition: border-color 0.2s; 
            resize: none;
            overflow-y: auto; /* Enforces the inside scrollbar */
        }
        textarea:focus { border-color: var(--border-focus); }
        .visualizer { white-space: pre-wrap; background-color: #fafafa; }
        
        /* Focus Mode: Faded Exclusions instead of glaring red */
        .excluded-text { color: #a0a0a0; text-decoration: line-through; }

        @media (max-width: 768px) {
            .controls-wrapper, .text-grid, .dashboard { grid-template-columns: 1fr; }
            .dashboard { padding: 20px 0; gap: 15px; }
            textarea, .visualizer { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>StrictCount</h1>
        <div class="subtitle">Accurate academic word filtering.</div>
    </header>

    <div class="upload-zone" id="dropZone">
        <p>Drop your <strong>.docx or .pdf</strong> here</p>
        <p>or <label for="fileInput" class="upload-label">browse files</label></p>
        <input type="file" id="fileInput" accept=".docx,.pdf" style="display: none;">
    </div>

    <div class="controls-wrapper" id="controlPanel">
        <div class="control-group">
            <span class="control-label">Document Boundaries</span>
            <input type="text" id="startMarker" class="boundary-input" placeholder='Start counting at (e.g., Introduction)'>
            <input type="text" id="endMarker" class="boundary-input" placeholder='Stop counting at (e.g., References)'>
        </div>
        
        <div class="control-group">
            <span class="control-label">Active Filters</span>
            <div class="checkbox-group">
                <label><input type="checkbox" id="excludeAPA" checked> Remove APA/Harvard citations</label>
                <label><input type="checkbox" id="excludeMLA" checked> Remove MLA citations</label>
                <label><input type="checkbox" id="excludeIEEE" checked> Remove IEEE/Chicago citations</label>
                <label><input type="checkbox" id="excludeCaptions" checked> Remove figure captions & mentions</label> 
            </div>
        </div>
    </div>

    <div class="dashboard">
        <div class="stat-box"><h3>Gross Words</h3><p id="originalCount">0</p></div>
        <div class="stat-box"><h3>Excluded</h3><p id="excludedCount">0</p></div>
        <div class="stat-box highlight"><h3>Strict Count</h3><p id="finalCount">0</p></div>
    </div>

    <button class="btn" id="copyBtn">Copy Clean Text</button>

    <div class="text-grid">
        <div class="panel-wrapper">
            <div class="panel-header">Raw Input</div>
            <textarea id="inputText" placeholder="Paste text here..."></textarea>
        </div>
        
        <div class="panel-wrapper">
            <div class="panel-header">Verified Output</div>
            <div id="visualizer" class="visualizer"></div>
        </div>
    </div>

    <script>
        const regexAPA = /\([^)]*\b\d{4}\b[^)]*\)/g; 
        const regexMLA = /\([A-Za-z\s\.\-&]+ \d+\)/g;
        const regexIEEE = /(\[\s*\d+(?:\s*[-,]\s*\d+)*\s*\])|(\(\s*\d+(?:\s*[-,]\s*\d+)*\s*\))/g; 
        const regexCaptions = /^\s*(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[.:\-]?\s+[\s\S]*?(?=\n\n|$)/gim;
        const regexInTextFigs = /\([^)]*\b(?:Figure|Fig\.?|Table)\s+[A-Za-z0-9]+[^)]*\)/gi;

        let finalCleanText = "";

        function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function countWords(str) { const words = str.trim().split(/\s+/); return words[0] === '' ? 0 : words.length; }

        function processText() {
            const rawText = document.getElementById('inputText').value;
            
            if (!rawText.trim()) {
                document.getElementById('visualizer').innerHTML = "";
                document.getElementById('originalCount').innerText = "0";
                document.getElementById('finalCount').innerText = "0";
                document.getElementById('excludedCount').innerText = "0";
                finalCleanText = "";
                return;
            }

            let filteredText = rawText;
            let visualText = rawText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const activeFilters = [];
            const startStr = document.getElementById('startMarker').value.trim();
            const endStr = document.getElementById('endMarker').value.trim();

            if (startStr !== "") activeFilters.push(new RegExp('^[\\s\\S]*?(?=\\b' + escapeRegExp(startStr) + '\\b)', 'i'));
            if (endStr !== "") activeFilters.push(new RegExp('\\b' + escapeRegExp(endStr) + '\\b[\\s\\S]*', 'i'));
            
            if (document.getElementById('excludeAPA').checked) activeFilters.push(regexAPA);
            if (document.getElementById('excludeMLA').checked) activeFilters.push(regexMLA);
            if (document.getElementById('excludeIEEE').checked) activeFilters.push(regexIEEE);
            if (document.getElementById('excludeCaptions').checked) {
                activeFilters.push(regexCaptions);
                activeFilters.push(regexInTextFigs); 
            }

            activeFilters.forEach(regex => {
                filteredText = filteredText.replace(regex, ' ');
                visualText = visualText.replace(regex, match => `<span class="excluded-text">${match}</span>`);
            });

            finalCleanText = filteredText.replace(/\s+/g, ' ').trim();

            const ogCount = countWords(rawText);
            const finCount = countWords(filteredText);
            
            document.getElementById('originalCount').innerText = ogCount;
            document.getElementById('finalCount').innerText = finCount;
            document.getElementById('excludedCount').innerText = ogCount - finCount;
            document.getElementById('visualizer').innerHTML = visualText;
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const textArea = document.getElementById('inputText');

        async function extractTextFromPDF(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let extractedText = [];
            
            for (let j = 1; j <= pdf.numPages; j++) {
                let page = await pdf.getPage(j);
                let textContent = await page.getTextContent();
                let pageText = "";
                let lastY = -1;

                for (let item of textContent.items) {
                    let str = item.str.trim();
                    if (!str) continue; 
                    
                    if (lastY !== -1) {
                        let deltaY = Math.abs(lastY - item.transform[5]);
                        if (deltaY > 22) { pageText += '\n\n'; } 
                        else if (deltaY > 4) { pageText += ' '; }
                        else { pageText += ' '; }
                    }
                    pageText += str;
                    lastY = item.transform[5];
                }
                extractedText.push(pageText);
            }
            return extractedText.join('\n\n');
        }

        function handleFile(file) {
            const extension = file.name.split('.').pop().toLowerCase();
            if (extension !== 'docx' && extension !== 'pdf') { alert("Unsupported file format. Please use .docx or .pdf."); return; }

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    let extractedString = "";
                    if (extension === 'docx') {
                        const result = await mammoth.extractRawText({arrayBuffer: event.target.result});
                        extractedString = result.value;
                    } 
                    else if (extension === 'pdf') {
                        extractedString = await extractTextFromPDF(event.target.result);
                    }
                    textArea.value = extractedString;
                    processText(); 
                } catch (err) { alert(`Error reading your ${extension.toUpperCase()} file.`); }
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', e => { if(e.target.files.length > 0) handleFile(e.target.files[0]); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        textArea.addEventListener('input', processText);
        document.querySelectorAll('#controlPanel input[type="checkbox"]').forEach(box => box.addEventListener('change', processText));
        document.querySelectorAll('.boundary-input').forEach(input => input.addEventListener('input', processText));

        document.getElementById('copyBtn').addEventListener('click', function(e) {
            if (!finalCleanText) return;
            navigator.clipboard.writeText(finalCleanText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "Copied to Clipboard";
                btn.style.backgroundColor = "#27ae60"; 
                
                setTimeout(() => {
                    btn.innerText = "Copy Clean Text";
                    btn.style.backgroundColor = "var(--text-main)";
                }, 2000);
            });
        });
    </script>
</body>
</html>
